events {}

http {
  server {
    listen 80;

    # DNS nội bộ của Docker. Bắt buộc phải có, vì tên service chỉ được phân giải
    # lại khi proxy_pass chứa biến; viết thẳng `proxy_pass http://link:3000` thì
    # nginx phân giải đúng một lần lúc nạp config rồi giữ mãi IP cũ, nên lần
    # triển khai lại nào làm container đổi IP cũng cho 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Các đường dẫn vận hành của cả ba service, kể cả worker stats: hai đường dẫn
    # thăm dò và endpoint metrics. Đây là cách duy nhất hỏi được `stats`, vì nó
    # không có mục `ports:` nào.
    #
    # Khối regex này không nuốt mất mã ngắn nào: prefix `/internal/` dài 10 ký tự
    # trong khi mã ngắn luôn đúng 7, nên không mã nào rơi vào đây.
    location ~ ^/internal/(?<svc>link|redirect|stats)/(?<endpoint>healthz|readyz|metrics)$ {
      set $upstream $svc:3000;
      proxy_pass http://$upstream/$endpoint;
    }

    # Quản lý vòng đời link
    location /api/ {
      set $link link:3000;
      proxy_pass http://$link$request_uri;
      proxy_set_header Host $host;
    }

    # Mọi đường dẫn còn lại là một mã ngắn cần chuyển hướng
    location / {
      set $redirect redirect:3000;
      proxy_pass http://$redirect$request_uri;
      proxy_set_header Host $host;
      proxy_redirect off;
    }
  }
}
